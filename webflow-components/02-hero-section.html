<!--
COMPONENT: Hero Section with Vintage Photo Treatment
INSTALLATION: Add this as an Embed element in Webflow

FEATURES:
- Kodachrome-style photo treatment
- Typewriter effect for headline
- Vintage photo border
- Animated "Latest Adventure" CTA
- Responsive background image

WEBFLOW SETUP:
1. Create a Section
2. Add Embed element
3. Paste this entire code
4. Replace IMAGE_URL with your photo
5. Customize headline text as needed
-->

<div class="hero-vintage">
  <!-- Background Image with Vintage Treatment -->
  <div class="hero-bg" style="background-image: url('IMAGE_URL');"></div>

  <!-- Vintage Photo Border Overlay -->
  <div class="hero-border"></div>

  <!-- Content -->
  <div class="hero-content">
    <div class="hero-stamp">LATEST ADVENTURE</div>
    <h1 class="hero-headline" id="typewriter"></h1>
    <p class="hero-location">
      <span class="location-pin">📍</span>
      <span id="hero-location">Grand Canyon, Arizona</span>
    </p>
    <a href="#story" class="btn hero-cta">Read the Field Report</a>
  </div>

  <!-- Film Grain Overlay -->
  <div class="film-grain"></div>
</div>

<style>
.hero-vintage {
  position: relative;
  height: 600px;
  overflow: hidden;
  margin-bottom: 48px;
}

.hero-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  /* Kodachrome filter */
  filter: saturate(1.4) contrast(1.15) sepia(0.15) brightness(0.95);
  transform: scale(1.05);
  transition: transform 8s ease-out;
}

.hero-vintage:hover .hero-bg {
  transform: scale(1.1);
}

.hero-border {
  position: absolute;
  top: 12px;
  left: 12px;
  right: 12px;
  bottom: 12px;
  border: 16px solid #f5f5dc;
  box-shadow:
    inset 0 0 40px rgba(0, 0, 0, 0.4),
    0 8px 24px rgba(0, 0, 0, 0.6);
  pointer-events: none;
  z-index: 2;
}

.hero-content {
  position: relative;
  z-index: 3;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 48px 24px;
  background: linear-gradient(180deg, rgba(58, 52, 46, 0.3) 0%, rgba(58, 52, 46, 0.7) 100%);
}

.hero-stamp {
  font-family: "Oswald", "Arial Narrow", sans-serif;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #E8E3D6;
  background: linear-gradient(135deg, #6B5A4A 0%, #3A342E 100%);
  border: 3px solid #A67B5B;
  padding: 8px 20px;
  margin-bottom: 24px;
  box-shadow:
    0 4px 8px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(212, 147, 90, 0.2);
  transform: rotate(-2deg);
  animation: stamp-appear 0.5s ease-out 0.3s both;
}

@keyframes stamp-appear {
  0% {
    opacity: 0;
    transform: rotate(-2deg) scale(0.8);
  }
  100% {
    opacity: 1;
    transform: rotate(-2deg) scale(1);
  }
}

.hero-headline {
  font-size: clamp(2.5rem, 6vw, 5rem);
  color: #E8E3D6;
  margin-bottom: 24px;
  text-shadow:
    3px 3px 6px rgba(0,0,0,0.8),
    0 0 20px rgba(212, 147, 90, 0.3);
  min-height: 1.2em;
}

.hero-location {
  font-family: "Courier New", monospace;
  font-size: 1.25rem;
  color: #E8E3D6;
  margin-bottom: 32px;
  opacity: 0;
  animation: fade-in 0.6s ease-out 1.5s both;
}

.location-pin {
  display: inline-block;
  animation: pin-drop 0.6s ease-out 1.5s both;
}

@keyframes pin-drop {
  0% {
    transform: translateY(-20px);
    opacity: 0;
  }
  60% {
    transform: translateY(5px);
  }
  100% {
    transform: translateY(0);
    opacity: 1;
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.hero-cta {
  opacity: 0;
  animation: fade-in 0.6s ease-out 2s both;
}

.film-grain {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJhIiB4PSIwIiB5PSIwIj48ZmVUdXJidWxlbmNlIGJhc2VGcmVxdWVuY3k9Ii43NSIgc3RpdGNoVGlsZXM9InN0aXRjaCIgdHlwZT0iZnJhY3RhbE5vaXNlIi8+PGZlQ29sb3JNYXRyaXggdHlwZT0ic2F0dXJhdGUiIHZhbHVlcz0iMCIvPjwvZmlsdGVyPjxwYXRoIGQ9Ik0wIDBoMzAwdjMwMEgweiIgZmlsdGVyPSJ1cmwoI2EpIiBvcGFjaXR5PSIuMDUiLz48L3N2Zz4=');
  opacity: 0.4;
  pointer-events: none;
  z-index: 1;
  mix-blend-mode: overlay;
}

/* Responsive */
@media (max-width: 767px) {
  .hero-vintage {
    height: 400px;
  }

  .hero-border {
    top: 8px;
    left: 8px;
    right: 8px;
    bottom: 8px;
    border-width: 10px;
  }

  .hero-stamp {
    font-size: 0.7rem;
    padding: 6px 12px;
  }
}
</style>

<script>
// Typewriter Effect
(function() {
  const text = "Trail to the Canyon's Hidden Rim";
  const element = document.getElementById('typewriter');
  let index = 0;

  function typeWriter() {
    if (index < text.length) {
      element.innerHTML += text.charAt(index);
      index++;
      setTimeout(typeWriter, 80);
    }
  }

  // Start typewriter after a delay
  setTimeout(typeWriter, 800);
})();
</script>
